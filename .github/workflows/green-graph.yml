name: Keep Contribution Graph Green

on:
  schedule:
    # Runs twice daily at 00:00 and 12:00 UTC
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Minimum commits per day for 'More' category"
        required: false
        default: "450"
        type: string
      max_target:
        description: "Maximum commits per day for natural daily variation"
        required: false
        default: "545"
        type: string

jobs:
  green:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git
        run: |
          git config user.name "aasimdev"
          git config user.email "asimsafeer75@gmail.com"

      - name: Run graph-greener
        env:
          TZ_OFFSET: "+0500"
        run: |
          TARGET="${{ inputs.target || '450' }}"
          MAX_TARGET="${{ inputs.max_target || '545' }}"
          python3 main.py --fill-more --target "$TARGET" --max-target "$MAX_TARGET"
